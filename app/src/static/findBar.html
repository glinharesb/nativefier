<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'"
    />
    <title>Find</title>
    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
        overflow: hidden;
      }
      .bar {
        display: flex;
        align-items: center;
        gap: 6px;
        margin: 0 2px;
        padding: 6px 8px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        border-radius: 8px;
        background: #f6f6f6;
        box-shadow: 0 4px 16px rgba(0, 0, 0, 0.18);
        font: 13px -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        color: #1d1d1f;
      }
      input {
        flex: 1;
        min-width: 0;
        padding: 4px 6px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 5px;
        background: #fff;
        color: inherit;
        font: inherit;
        outline: none;
      }
      input:focus {
        border-color: #0a84ff;
        box-shadow: 0 0 0 3px rgba(10, 132, 255, 0.25);
      }
      .count {
        min-width: 52px;
        text-align: center;
        opacity: 0.6;
        font-variant-numeric: tabular-nums;
      }
      .count.none {
        color: #d70015;
        opacity: 1;
      }
      button {
        min-width: 24px;
        padding: 3px 6px;
        border: 1px solid rgba(0, 0, 0, 0.2);
        border-radius: 5px;
        background: #fff;
        color: inherit;
        font: inherit;
        line-height: 1;
        cursor: pointer;
      }
      button:hover {
        background: #ececec;
      }
      @media (prefers-color-scheme: dark) {
        .bar {
          border-color: rgba(255, 255, 255, 0.15);
          background: #2c2c2e;
          color: #f5f5f7;
        }
        input,
        button {
          border-color: rgba(255, 255, 255, 0.2);
          background: #1c1c1e;
          color: inherit;
        }
        button:hover {
          background: #3a3a3c;
        }
        .count.none {
          color: #ff453a;
        }
      }
    </style>
  </head>
  <body>
    <div class="bar">
      <input id="query" type="text" placeholder="Find" aria-label="Find in page" />
      <span id="count" class="count"></span>
      <button id="previous" title="Previous match">&lsaquo;</button>
      <button id="next" title="Next match">&rsaquo;</button>
      <button id="close" title="Close">&#10005;</button>
    </div>
    <script>
      const api = window.nativefierFindBar;
      const query = document.getElementById('query');
      const count = document.getElementById('count');

      // findNext === true starts a new finding session (a new query);
      // false is a follow-up that steps through the current query's matches.
      function search(forward, findNext) {
        api.search(query.value, forward, findNext);
        if (!query.value) {
          setCount(0, 0);
        }
      }

      function step(forward) {
        if (query.value) {
          search(forward, false);
        }
      }

      function setCount(activeMatchOrdinal, matches) {
        count.textContent = matches > 0 ? activeMatchOrdinal + '/' + matches : '';
        count.classList.toggle('none', Boolean(query.value) && matches === 0);
      }

      query.addEventListener('input', () => search(true, true));
      query.addEventListener('keydown', (event) => {
        if (event.key === 'Enter') {
          event.preventDefault();
          step(!event.shiftKey);
        } else if (event.key === 'Escape') {
          event.preventDefault();
          api.close();
        }
      });
      document.getElementById('previous').addEventListener('click', () => step(false));
      document.getElementById('next').addEventListener('click', () => step(true));
      document.getElementById('close').addEventListener('click', () => api.close());

      api.onResult((result) => setCount(result.activeMatchOrdinal, result.matches));
      api.onStep((forward) => step(forward));
      api.onFocus(() => {
        query.focus();
        query.select();
        if (query.value) {
          search(true, true);
        }
      });
    </script>
  </body>
</html>
